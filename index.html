<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Zealand itinerary, 6 to 13 December 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Lora:wght@400;600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: 58px; }
body {
  font-family: "Public Sans", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  background: #F4F4F7;
  color: #1A1A2E;
}
h1, h2, h3 { font-family: "Lora", Georgia, serif; font-weight: 700; line-height: 1.25; }
a { color: #376DA4; }

.header { background: #1D6068; color: #fff; padding: 18px 20px 12px; }
.header-inner, .strip-inner, .nav-inner, .main { max-width: 780px; margin: 0 auto; }
.header h1 { font-size: 1.6rem; }
.header details { margin-top: 4px; }
.header summary { font-size: 0.9rem; padding: 4px 0; color: rgba(255,255,255,0.82); cursor: pointer; width: fit-content; }
.header summary:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.header p { font-size: 0.95rem; color: rgba(255,255,255,0.88); max-width: 70ch; margin-top: 6px; }

.strip { background: #164A50; padding: 10px 20px; }
.strip-inner { display: flex; flex-wrap: wrap; gap: 4px 24px; }
.place { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: rgba(255,255,255,0.9); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.nav { background: #fff; border-bottom: 1px solid #D4D4DA; position: sticky; top: 0; z-index: 10; }
.nav-inner { display: flex; overflow-x: auto; padding: 0 12px; }
.tab {
  flex: none;
  min-height: 48px;
  padding: 6px 10px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: none;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  color: #55556A;
  cursor: pointer;
  text-align: left;
}
.tab .t1 { display: block; font-size: 0.72rem; font-weight: 400; line-height: 1.2; }
.tab .t2 { display: block; line-height: 1.25; }
.tab small { display: block; line-height: 1.2; font-size: 0.72rem; font-weight: 400; color: #55556A; }
.tab:hover { color: #1A1A2E; }
.tab:focus-visible { outline: 2px solid #376DA4; outline-offset: -2px; }
.tab[aria-selected="true"] { color: #1D6068; border-bottom-color: #1D6068; font-weight: 700; }

.main { padding: 20px 20px 56px; }
.panel[hidden] { display: none; }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; margin-bottom: 10px; }
.panel h2 { font-size: 1.5rem; }
.panel .date { font-size: 0.92rem; color: #55556A; }
.hero { position: relative; height: 210px; border-radius: 12px; overflow: hidden; margin-bottom: 12px; background: #1D6068; box-shadow: 0 1px 3px rgba(16,16,32,0.12); }
.hero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,24,30,0.78) 0%, rgba(10,24,30,0.45) 38%, rgba(10,24,30,0) 70%); }
.hero-text { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 16px 20px 14px; color: #fff; }
.hero-day { display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.45); }
.hero-text h2 { font-size: 1.65rem; margin-top: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.45); }
.hero-text .date { color: rgba(255,255,255,0.92); font-size: 0.92rem; margin-top: 2px; }
.lead { max-width: 76ch; margin-bottom: 14px; font-size: 1rem; }

.snapshot {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  background: #fff;
  border: 1px solid #D4D4DA;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 16px;
}
.snapshot div { padding: 9px 14px; margin: 0 -1px -1px 0; border-right: 1px solid #D4D4DA; border-bottom: 1px solid #D4D4DA; }
.snapshot dt { font-size: 0.75rem; line-height: 1.35; color: #55556A; }
.snapshot dd { font-size: 0.92rem; line-height: 1.4; font-weight: 600; }

.card {
  background: #fff;
  border: 1px solid #D4D4DA;
  border-left: 4px solid #8E8E9A;
  border-radius: 8px;
  padding: 16px 18px;
  box-shadow: 0 1px 2px rgba(16,16,32,0.06);
}
.card + .card { margin-top: 12px; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.card-head .ttl { min-width: 0; }
.icon { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; }
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.kind { display: block; font-size: 0.75rem; line-height: 1.3; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #3D3D50; }
.card h3 { font-size: 1.15rem; line-height: 1.3; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 12px 16px; margin-bottom: 12px; padding: 14px 0 0; border-top: 1px solid #E6E6EC; }
.stats dt { font-size: 0.75rem; line-height: 1.3; margin-bottom: 2px; color: #55556A; }
.stats dd { font-size: 1.05rem; font-weight: 700; line-height: 1.35; }
.card p { max-width: 70ch; font-size: 0.95rem; line-height: 1.55; }
.card p + p { margin-top: 8px; }
.card .book { margin-top: 12px; padding: 8px 12px; background: #F4F4F7; border-radius: 6px; font-size: 0.88rem; }
.card .book.done { border-left: 3px solid #2E7D5B; }
.card .book.todo { border-left: 3px solid #C39A44; }
.card.g-travel { border-left-color: #376DA4; }
.card.g-travel .icon { background: #E6EEF7; color: #2B5A8C; }
.card.g-doing { border-left-color: #479FA4; }
.card.g-doing .icon { background: #E4F4F4; color: #1F6B70; }
.card.g-eat { border-left-color: #C07A5E; }
.card.g-eat .icon { background: #F8E9E2; color: #8A4429; }
.card.g-stay { border-left-color: #7A68A8; }
.card.g-stay .icon { background: #EDE9F6; color: #51407A; }
.stats dd { display: flex; align-items: flex-start; gap: 6px; }
.tod { display: inline-flex; flex: none; width: 20px; height: 20px; margin-top: 1px; }
.tod svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tod-morning { color: #A8620A; }
.tod-afternoon { color: #9A7400; }
.tod-evening { color: #B5482F; }
.tod-night { color: #4B4F9E; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 0 0 14px; font-size: 0.82rem; color: #3D3D50; }
.legend-title { font-weight: 700; color: #1A1A2E; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-item small { font-size: 0.75rem; color: #55556A; }

.box { background: #fff; border: 1px solid #D4D4DA; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
.box h3 { font-size: 1.1rem; margin-bottom: 8px; }
.box ol, .box ul { padding-left: 22px; max-width: 70ch; }
.box li + li { margin-top: 6px; }
.box ol + p, .box ul + p { margin-top: 12px; }
.box p { max-width: 70ch; }
.box p + p { margin-top: 8px; }
.warn { background: #FFF9E8; border-color: #E8DDB8; }

.bk { margin-bottom: 18px; }
.bk h3 { font-size: 1.1rem; margin-bottom: 8px; }
.bkrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; background: #fff; border: 1px solid #D4D4DA; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.bkrow.done { border-left: 3px solid #2E7D5B; }
.bkrow.todo { border-left: 3px solid #C39A44; }
.bkmain { display: flex; flex-direction: column; min-width: 0; }
.bkname { font-weight: 700; line-height: 1.35; }
.bkday { font-size: 0.85rem; color: #55556A; }
.bkcost { font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bkrow.sum { border-left: 3px solid #1D6068; }
.bkrow.sum:last-child { background: #E4F4F4; }
.bknote { grid-column: 1 / -1; font-size: 0.88rem; line-height: 1.5; color: #3D3D50; max-width: 70ch; }
.footer { margin-top: 28px; font-size: 0.85rem; color: #3D3D50; }
.footer h3 { font-size: 1rem; margin-bottom: 6px; }
.footer ul { padding-left: 20px; }

@media (max-width: 640px) {
  .hero { height: 215px; }
  .hero-text { padding: 12px 14px 12px; }
  .hero-text h2 { font-size: 1.3rem; }
  .header { padding: 16px 16px 10px; }
  .header h1 { font-size: 1.4rem; }
  .strip { padding: 8px 16px; }
  .main { padding: 16px 16px 48px; }
  .legend-item small { display: none; }
  .card { padding: 14px 14px 16px; }
}
@media print {
  .nav { display: none; }
  .panel[hidden] { display: block; }
  .panel { break-before: page; }
  body { background: #fff; }
  .hero { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

function todOf(v) {
  var m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(v);
  var best = null;
  if (m) {
    var h = parseInt(m[1], 10) % 12 + (m[3].toLowerCase() === 'pm' ? 12 : 0);
    var name = h >= 5 && h < 12 ? 'morning' : h >= 12 && h < 17 ? 'afternoon' : h >= 17 && h < 21 ? 'evening' : 'night';
    best = { idx: m.index, name: name };
  }
  [['morning', /morning/i], ['afternoon', /afternoon/i], ['evening', /evening/i]].forEach(function (w) {
    var k = w[1].exec(v);
    if (k && (!best || k.index < best.idx)) { best = { idx: k.index, name: w[0] }; }
  });
  return best ? best.name : null;
}

}

var DAY_SCENE = ['road', 'queenstown', 'teanau', 'milford', 'doubtful', 'glowworm', 'steamship', 'gardens', 'clouds'];

function heroHtml(d, idx) {
  var key = DAY_SCENE[idx];
  var svg = '<svg viewBox="0 0 780 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' + SCENES[key](idx) + '</svg>';
  return '<div class="hero">' + svg + '<div class="hero-text"><span class="hero-day">' + d.label + '</span><h2>' + d.title + '</h2><p class="date">' + d.date + '</p></div></div>';
}
function factsHtml(d) {
  if (!d.facts) { return ''; }
  var h = '<dl class="snapshot">';
  d.facts.forEach(function (f) { h += '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; });
  return h + '</dl>';
}

function panelHtml(d, idx) {
  if (d.custom) {
    return '<div class="ph"><h2>' + d.label + ': ' + d.title + '</h2><p class="date">' + d.date + '</p></div>' + BOOKINGS;
  }
  var h = heroHtml(d, idx) + factsHtml(d);
  h += '<p class="lead">' + d.lead + '</p>';
  d.stops.forEach(function (s) { h += stopHtml(s); });
  if (d.after) { h += '<p class="lead" style="margin-top:16px;font-size:0.9rem;color:#55556A">' + d.after + '</p>'; }
  return h;
}

var tabsEl = document.getElementById('tabs');
var panelsEl = document.getElementById('panels');

DAYS.forEach(function (d, i) {
  var b = document.createElement('button');
  b.className = 'tab';
  b.setAttribute('role', 'tab');
  b.setAttribute('id', 'tab-' + i);
  b.setAttribute('aria-controls', 'panel-' + i);
  var tp = /^(\w{3}) (.+)$/.exec(d.tab);
  b.innerHTML = (tp ? '<span class="t1">' + tp[1] + '</span><span class="t2">' + tp[2] + '</span>' : d.tab) + '<small>' + d.label + '</small>';
  b.addEventListener('click', function () { show(i, true); });
  b.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { show(Math.min(i + 1, DAYS.length - 1), true); document.getElementById('tab-' + Math.min(i + 1, DAYS.length - 1)).focus(); }
    if (e.key === 'ArrowLeft') { show(Math.max(i - 1, 0), true); document.getElementById('tab-' + Math.max(i - 1, 0)).focus(); }
  });
  tabsEl.appendChild(b);

  var p = document.createElement('section');
  p.className = 'panel';
  p.setAttribute('role', 'tabpanel');
  p.setAttribute('id', 'panel-' + i);
  p.setAttribute('aria-labelledby', 'tab-' + i);
  p.innerHTML = panelHtml(d, i);
  panelsEl.appendChild(p);
});

function show(n, scroll) {
  DAYS.forEach(function (d, i) {
    var t = document.getElementById('tab-' + i);
    var p = document.getElementById('panel-' + i);
    var on = i === n;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.setAttribute('tabindex', on ? '0' : '-1');
    if (on) { p.removeAttribute('hidden'); } else { p.setAttribute('hidden', ''); }
  });
  try { history.replaceState(null, '', '#day' + n); } catch (e) {}
  if (scroll) { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  var active = document.getElementById('tab-' + n);
  if (active && active.scrollIntoView) { active.scrollIntoView({ block: 'nearest', inline: 'center' }); }
}

var start = 0;
var m = /^#day(\d+)$/.exec(location.hash || '');
if (m) { start = Math.min(Math.max(parseInt(m[1], 10), 0), DAYS.length - 1); }
show(start, false);
</script>
