'<li>The Milford Sound cruise for Tuesday 8 December, with free cancellation, so a closed road costs you nothing.</li>' +
'<li>The Doubtful Sound cruise for Wednesday 9 December, from Te Anau.</li>' +
'<li>The TSS Earnslaw cruise on Friday 11 December, the Te Anau Glowworm Caves trip on Thursday 10 December, and a Māori culture experience on Friday evening or Saturday morning.</li>' +
'</ol><p>Also book a room near Auckland Airport for Saturday 12 December. It is less urgent than the items above.</p></div>' +
'<div class="box"><h3>Before you fly</h3><ul>' +
'<li>Australian passport holders need no visa and no NZeTA. Check each passport&#39;s expiry date against your travel dates and the airline&#39;s conditions.</li>' +
'<li>Each of you completes a free New Zealand Traveller Declaration before you reach passport control. Do it before you board.</li>' +
'<li>Declare used hiking boots and other outdoor gear. Clean them before you pack them.</li>' +
'<li>Ask the Novotel for early check-in on Sunday 6 December, and to hold your bags on Friday 11 and Saturday 12 December.</li>' +
'<li>Find the excess amount in Budget&#39;s rental terms, and check whether your travel insurance or credit card covers it.</li>' +
'<li>Bring the driving licence and the credit card used for the car booking. The name on both must match the booking.</li>' +
'<li>Check that your Distinction confirmation email shows 3 adults and the bedding you asked for. If not, email reservations@distinctionteanau.co.nz with the booking ID.</li>' +
'</ul></div>' +
'<div class="box"><h3>Check before each driving day</h3><ul>' +
'<li>Milford Road status at the <a href="https://www.nzta.govt.nz/projects/sh94-milford-road/sh94-milford-road-status">NZTA SH94 Milford Road status</a>, at highwayinfo.govt.nz or on 0800 44 44 49. Milford Lodge says the road usually closes on some days each year because of weather, avalanches, slips or flooding.</li>' +
'</ul></div>' +
'<div class="box warn"><h3>If the Milford Road is closed on Tuesday</h3>' +
'<p>Move the Milford cruise to Wednesday 9 December and the Doubtful Sound cruise to Thursday 10 December, and drop the glowworm caves. You do not need to change your accommodation, because all four Te Anau nights are already booked. If Doubtful Sound is cancelled instead, move it to Thursday.</p></div>' +
'<div class="box"><h3>Not confirmed</h3><ul>' +
'<li>Which Māori experience to book. I have not chosen one, and I have not opened or checked the two listings above. I found no other Māori experience on this route, and Ko Tāne is in Christchurch.</li>' +
'<li>Opening hours, sailing times and prices for Kiwi Birdlife Park, the TSS Earnslaw, Te Anau Bird Sanctuary (including the takahē feeding time), the Glowworm Caves (including the 7:00pm departure), the Doubtful Sound cruise and the Arrowtown Chinese Settlement.</li>' +
'<li>Sunday hours and vegan options at the Frankton breakfast places, and whether any of them is quiet.</li>' +
'<li>Whether the Novotel and the Te Anau villa can check you in early or keep your bags, and whether the villa has any view. Its page does not describe one.</li>' +
'<li>The Novotel confirmation numbers, whether the Friday night includes parking, and the bedding setup the villa gives you.</li>' +
'<li>The excess amount and the fuel policy for the Budget car.</li>' +
'<li>Overnight opening times for the Air New Zealand transfer desk and the domestic check-in in Auckland.</li>' +
'<li>Whether your bags are checked through to Queenstown on Sunday morning and to Sydney on Sunday 13 December. Auckland Airport says you must collect them after an international arrival in any case.</li>' +
'<li>The rule that used hiking boots must be declared comes from a travel blog. Check biosecurity.govt.nz for the cleaning standard.</li>' +
'<li>Aoraki/Mount Cook is not in this plan. The sources disagreed on whether the Hooker Valley Track is partly closed, and the drive is long, so check DOC if you want to add it.</li>' +
'<li>Hotel names, prices and shuttle times near Auckland Airport, and the price of every item above.</li>' +
'</ul></div>' +
'<div class="footer"><h3>Sources</h3><p>Booking details come from the Budget confirmation and the Distinction and Novotel booking screens you sent me.</p><p style="margin-top:8px">Pages I opened:</p><ul>' +
'<li><a href="https://www.distinctionhotelsteanau.co.nz/teanau-hotel-accommodation/deluxe-two-bedroom-villa">Deluxe Two Bedroom Villa (Distinction Te Anau)</a></li>' +
'<li><a href="https://www.fiordland.org.nz/plan/getting-to-fiordland/">Getting to Fiordland</a></li>' +
'<li><a href="https://aucklandairport.co.nz/transport/travel-between-terminals">Travel between terminals (Auckland Airport)</a></li>' +
'<li><a href="https://www.doc.govt.nz/hooker-valley-track">Hooker Valley Track (DOC)</a></li>' +
'</ul><p style="margin-top:8px">Search results I did not open: ' +
'<a href="https://milfordlodge.com/articles/milford-road-latest-updates">Milford Lodge</a>, ' +
'<a href="https://www.nzta.govt.nz/projects/sh94-milford-road/sh94-milford-road-status">NZTA: SH94 Milford Road status</a>, ' +
'<a href="https://www.immigration.govt.nz/new-zealand-visas/already-have-a-visa/managing-your-visa-and-passport/details-page-for-passport-sticker/visa/australian-resident-visa">Immigration NZ: Australian Resident Visa</a>, ' +
'<a href="https://www.customs.govt.nz/travel-to-and-from-new-zealand/travel-by-air">NZ Customs: travel by air</a>, ' +
'<a href="https://queenstownairport.co.nz/transport/rental-cars">Queenstown Airport: rental cars</a>, ' +
'<a href="https://realnz.com/en/experiences/cruises/tss-earnslaw-lake-cruises">RealNZ: TSS Earnslaw</a>, ' +
'<a href="https://realnz.com/en/experiences/cruises/doubtful-sound-wilderness-cruises/doubtful-sound-wilderness-cruises">RealNZ: Doubtful Sound</a>.</p></div>';

var SVG = function (inner) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>'; };

var GROUPS = {
  travel: { icon: SVG('<polygon points="3 11 22 2 13 21 11 13 3 11"/>') },
  doing: { icon: SVG('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>') },
  eat: { icon: SVG('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>') },
  stay: { icon: SVG('<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M12 4v6"/><path d="M2 18h20"/>') }
};

var TYPES = {
  flight: { label: "Flight", group: "travel" },
  drive: { label: "Drive", group: "travel" },
  transfer: { label: "Transfer", group: "travel" },
  car: { label: "Hire car", group: "travel" },
  sight: { label: "Sight", group: "doing" },
  cruise: { label: "Cruise", group: "doing" },
  meal: { label: "Meal", group: "eat" },
  stay: { label: "Stay", group: "stay" }
};

var TOD = {
  morning: { label: "Morning", range: "5am to noon", icon: SVG('<path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>') },
  afternoon: { label: "Afternoon", range: "noon to 5pm", icon: SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>') },
  evening: { label: "Evening", range: "5pm to 9pm", icon: SVG('<path d="M12 10V2"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m16 6-4 4-4-4"/><path d="M16 18a4 4 0 0 0-8 0"/>') },
  night: { label: "Night", range: "9pm to 5am", icon: SVG('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>') }
};

function todOf(v) {
  var m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(v);
  var best = null;
  if (m) {
    var h = parseInt(m[1], 10) % 12 + (m[3].toLowerCase() === 'pm' ? 12 : 0);
    var name = h >= 5 && h < 12 ? 'morning' : h >= 12 && h < 17 ? 'afternoon' : h >= 17 && h < 21 ? 'evening' : 'night';
    best = { idx: m.index, name: name };
  }
  [['morning', /morning/i], ['afternoon', /afternoon/i], ['evening', /evening/i]].forEach(function (w) {
    var k = w[1].exec(v);
    if (k && (!best || k.index < best.idx)) { best = { idx: k.index, name: w[0] }; }
  });
  return best ? best.name : null;
}

function esc(s) { return s; }

function stopHtml(s) {
  var t = TYPES[s.type];
  var g = GROUPS[t.group];
  var out = '<article class="card g-' + t.group + '">';
  out += '<div class="card-head"><span class="icon">' + g.icon + '</span><div class="ttl"><span class="kind">' + t.label + '</span><h3>' + s.title + '</h3></div></div>';
  if (s.stats) {
    out += '<dl class="stats">';
    s.stats.forEach(function (x) {
      var k = todOf(x[1]);
      var mark = k ? '<span class="tod tod-' + k + '" role="img" aria-label="' + TOD[k].label + '" title="' + TOD[k].label + '">' + TOD[k].icon + '</span>' : '';
      out += '<div><dt>' + x[0] + '</dt><dd>' + mark + '<span>' + x[1] + '</span></dd></div>';
    });
    out += '</dl>';
  }
  (s.text || []).forEach(function (p) { out += '<p>' + p + '</p>'; });
  if (s.book) { out += '<p class="book ' + (/^Booked/.test(s.book) ? 'done' : 'todo') + '">' + s.book + '</p>'; }
  out += '</article>';
  return out;
}

function legendHtml() {
  var out = '<p class="legend"><span class="legend-title">Time of day</span>';
  ['morning', 'afternoon', 'evening', 'night'].forEach(function (k) {
    out += '<span class="legend-item"><span class="tod tod-' + k + '" aria-hidden="true">' + TOD[k].icon + '</span>' + TOD[k].label + ' <small>' + TOD[k].range + '</small></span>';
  });
  return out + '</p>';
}

function panelHtml(d, idx) {
  var h = '<div class="ph"><h2>' + d.label + ': ' + d.title + '</h2><p class="date">' + d.date + '</p></div>';
  if (d.custom) { return h + BOOKINGS; }
  h += '<p class="lead">' + d.lead + '</p>';
  h += '<dl class="snapshot">';
  d.facts.forEach(function (f) { h += '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; });
  h += '</dl>';
  h += legendHtml();
  d.stops.forEach(function (s) { h += stopHtml(s); });
  if (d.after) { h += '<p class="lead" style="margin-top:16px;font-size:0.9rem;color:#55556A">' + d.after + '</p>'; }
  return h;
}

var tabsEl = document.getElementById('tabs');
var panelsEl = document.getElementById('panels');

DAYS.forEach(function (d, i) {
  var b = document.createElement('button');
  b.className = 'tab';
  b.setAttribute('role', 'tab');
  b.setAttribute('id', 'tab-' + i);
  b.setAttribute('aria-controls', 'panel-' + i);
  var tp = /^(\w{3}) (.+)$/.exec(d.tab);
  b.innerHTML = (tp ? '<span class="t1">' + tp[1] + '</span><span class="t2">' + tp[2] + '</span>' : d.tab) + '<small>' + d.label + '</small>';
  b.addEventListener('click', function () { show(i, true); });
  b.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { show(Math.min(i + 1, DAYS.length - 1), true); document.getElementById('tab-' + Math.min(i + 1, DAYS.length - 1)).focus(); }
    if (e.key === 'ArrowLeft') { show(Math.max(i - 1, 0), true); document.getElementById('tab-' + Math.max(i - 1, 0)).focus(); }
  });
  tabsEl.appendChild(b);

  var p = document.createElement('section');
  p.className = 'panel';
  p.setAttribute('role', 'tabpanel');
  p.setAttribute('id', 'panel-' + i);
  p.setAttribute('aria-labelledby', 'tab-' + i);
  p.innerHTML = panelHtml(d, i);
  panelsEl.appendChild(p);
});

function show(n, scroll) {
  DAYS.forEach(function (d, i) {
    var t = document.getElementById('tab-' + i);
    var p = document.getElementById('panel-' + i);
    var on = i === n;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.setAttribute('tabindex', on ? '0' : '-1');
    if (on) { p.removeAttribute('hidden'); } else { p.setAttribute('hidden', ''); }
  });
  try { history.replaceState(null, '', '#day' + (n + 1)); } catch (e) {}
  if (scroll) { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  var active = document.getElementById('tab-' + n);
  if (active && active.scrollIntoView) { active.scrollIntoView({ block: 'nearest', inline: 'center' }); }
}

var start = 0;
var m = /^#day(\d+)$/.exec(location.hash || '');
if (m) { start = Math.min(Math.max(parseInt(m[1], 10) - 1, 0), DAYS.length - 1); }
show(start, false);
</script>
